<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مكتبة أبجد</title>
  <meta name="description" content="اختر الملازم التي تحتاجها وأرسل طلبك إلى مكتبة أبجد عبر واتساب، وتنافس في اختبارات مجانية.">
  <meta name="theme-color" content="#FFF8EE">

  <!-- يضبط الثيم قبل رسم الصفحة لمنع الوميض (يرفع الاختيار من localStorage) -->
  <script>
    (function () {
      try {
        var mode = 'system';
        var raw = localStorage.getItem('abgad.theme.v1');
        if (raw) mode = JSON.parse(raw) || 'system';
        if (mode !== 'light' && mode !== 'dark') mode = 'system';
        var dark = mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
      } catch (e) { /* وضع التصفح الخاص: نستخدم النظام */ }
    })();
  </script>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="أبجد">
