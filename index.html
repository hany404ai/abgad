<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مكتبة أبجد</title>
  <meta name="description" content="اختر الملازم التي تحتاجها، وجرّب اختبارات تفاعلية مجانية، وأرسل طلبك إلى مكتبة أبجد عبر واتساب.">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="color-scheme" content="light dark">

  <!-- يحدد الثيم قبل رسم الصفحة حتى لا يحدث وميض -->
  <script>
    (function () {
      try {
        var pref = JSON.parse(localStorage.getItem('abgad.theme.v1') || '"auto"');
        var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="أبجد">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lalezar&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <header class="top">
      <div class="top-inner">
        <a class="brand" href="#notebooks" aria-label="أبجد - الصفحة الرئيسية"><span class="logo">أبجد</span></a>

        <nav class="tabs" aria-label="التنقل الرئيسي">
          <a href="#notebooks" data-tab="notebooks">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6zM6 3v18M10 8h5M10 12h5"/></svg>
            <span>الملازم</span>
          </a>
          <a href="#quizzes" data-tab="quizzes">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v3H9zM7 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1M8.5 13l2.2 2.2L15.5 10.5"/></svg>
            <span>الاختبارات</span>
          </a>
          <a href="#me" data-tab="me">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
            <span>حسابي</span>
          </a>
        </nav>

        <div class="top-actions">
          <button type="button" class="icon-btn" id="theme-btn" aria-label="تبديل المظهر"></button>
          <a class="who" id="who" href="#me"></a>
        </div>
      </div>
    </header>

    <div class="shell">
      <main id="view" tabindex="-1"></main>
    </div>

    <div id="cartbar" class="cartbar" hidden></div>
  </div>

  <div id="overlay"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">يحتاج الموقع إلى تفعيل JavaScript حتى يعمل.</p></noscript>

  <script src="js/app.js" defer></script>
</body>
</html>
